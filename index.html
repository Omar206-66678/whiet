<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F9">
<script src="js/ui/theme.js"></script>
<title>White | بلايستيشن وكافيه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-card">
    <svg class="pad-lg" viewBox="0 0 160 110" aria-hidden="true"><use href="#pad"/></svg>
    <div class="brand lg-inline" aria-label="White"><svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><use href="#logo"/></svg><span class="wm">White</span></div>
    <p class="splash-tag">بلايستيشن وكافيه</p>
    <p class="splash-sub">شوف الأجهزة المتاحة الآن واحجز موعدك من مكانك.</p>
    <button class="btn-primary" id="startBtn">ابدأ الآن</button>
    <p class="splash-login">لديك حساب؟ <button class="link" id="splashLogin">سجّل الدخول</button></p>
  </div>
</div>

<header class="topbar" id="custTop">
  <button class="icon-btn" id="backBtn" aria-label="رجوع" hidden><svg class="i"><use href="#i-back"/></svg></button>
  <div class="top-title" id="topTitle"></div>
  <button class="icon-btn" data-theme-toggle aria-label="تبديل الوضع الداكن"></button>
</header>

<main id="app">
  <section class="view" data-view="home"></section>
  <section class="view" data-view="devices"></section>
  <section class="view" data-view="menu"></section>
  <section class="view" data-view="account"></section>
  <section class="view" data-view="detail"></section>
  <section class="view" data-view="booking"></section>
</main>

<nav class="bottomnav" id="bottomNav" aria-label="التنقل الرئيسي">
  <button class="nav-item" data-go="home"><svg class="i"><use href="#i-home"/></svg>الرئيسية</button>
  <button class="nav-item" data-go="devices"><svg class="i"><use href="#i-gamepad"/></svg>الأجهزة</button>
  <button class="nav-item" data-go="menu"><svg class="i"><use href="#i-coffee"/></svg>المنيو</button>
  <button class="nav-item" data-go="account"><svg class="i"><use href="#i-user"/></svg>حسابي</button>
</nav>

<div id="staffRoot"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/data/demo-db.js"></script>
<script src="js/core/status.js"></script>
<script src="js/core/phone.js"></script>
<script src="js/data/store.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/feedback.js"></script>
<script src="js/ui/fx.js"></script>
<script src="js/ui/pwa.js"></script>
<script src="js/app.js"></script>
</body>
</html>
